<title>액티브 ETF 겹침 추적</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: 상단 요약 띠 → 컨트롤 바 → 순위 테이블(행 클릭 시 아래로 상세 펼침) */
:root{
  --bg:#f5f6f4; --panel:#ffffff; --ink:#16201d; --muted:#5d6b66; --line:#dfe4e1; --soft:#eef1ef;
  --accent:#1f6f5c; --accent-soft:#e1efe9;
  --up:#d1322a; --down:#1f5fc4; --warn:#b26a00; --warn-soft:#fbefd9;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --panel:#161e1b; --ink:#e6ece9; --muted:#93a29c; --line:#26312d; --soft:#1c2622;
  --accent:#5cc2a4; --accent-soft:#183129; --up:#ff6b5e; --down:#6aa5ff; --warn:#f0b04a; --warn-soft:#33270f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --panel:#161e1b; --ink:#e6ece9; --muted:#93a29c; --line:#26312d; --soft:#1c2622;
  --accent:#5cc2a4; --accent-soft:#183129; --up:#ff6b5e; --down:#6aa5ff; --warn:#f0b04a; --warn-soft:#33270f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px}
h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
.stamp{color:var(--muted);font-size:12.5px;font-family:var(--f-num)}
.notice{background:var(--warn-soft);color:var(--ink);border-left:3px solid var(--warn);padding:10px 14px;border-radius:4px;font-size:13px}
.notice b{color:var(--warn)}
.summary{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--panel);border:1px solid var(--line);border-radius:8px}
.kpi{padding:12px 14px;border-right:1px solid var(--line);min-width:0}
.kpi:last-child{border-right:0}
.kpi .l{font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.kpi .v{font-family:var(--f-num);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:820px){.summary{grid-template-columns:repeat(3,minmax(0,1fr))}.kpi:nth-child(3){border-right:0}.kpi:nth-child(-n+3){border-bottom:1px solid var(--line)}}
@media (max-width:440px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi{border-right:1px solid var(--line)!important;border-bottom:1px solid var(--line)}.kpi:nth-child(2n){border-right:0!important}}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--muted);padding:6px 12px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg button:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.ctl-l{font-size:12px;color:var(--muted);margin-right:6px}
.tablebox{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:1000px}
th{font-size:11.5px;font-weight:600;color:var(--muted);text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel);position:sticky;top:0}
td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.row{cursor:pointer}
.row:hover td{background:var(--soft)}
.sym{font-family:var(--f-num);font-weight:600}
.cname{color:var(--muted);font-size:12.5px;display:block;max-width:220px}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;font-weight:600;white-space:nowrap}
.pill.new{background:var(--accent-soft);color:var(--accent)}
.pill.sell{background:var(--warn-soft);color:var(--warn)}
.up{color:var(--up)} .down{color:var(--down)}
.theme{font-size:12.5px;white-space:nowrap}
.desc{font-size:12.5px;color:var(--muted);max-width:340px;min-width:220px}
.d small{color:var(--muted);display:block;font-size:11px}
.detail td{background:var(--soft);padding:14px 16px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:700px){.dgrid{grid-template-columns:1fr}}
.dgrid h3{font-size:12px;margin:0 0 6px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.dl{display:grid;grid-template-columns:auto 1fr auto auto;gap:3px 14px;font-size:12.5px;align-items:baseline}
.dl .t{font-family:var(--f-num);font-weight:600}
.dl .x{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl .w{font-family:var(--f-num);text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
details.method{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px}
details.method summary{cursor:pointer;font-weight:600}
details.method ul{margin:10px 0 0;padding-left:18px;color:var(--muted);display:grid;gap:4px;max-width:80ch}
.etfs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.etfs span{font-family:var(--f-num);font-size:11.5px;background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.etfs span.miss{opacity:.5;text-decoration:line-through}
.vbox{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:12px;min-width:0}
.vhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px}
.vbox h2{font-size:16px;margin:0}
.vbox h3{font-size:12px;color:var(--muted);margin:0 0 6px;font-weight:600;letter-spacing:.02em}
.vsum{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:13px}
.vsum b{font-family:var(--f-num);font-size:16px}
.vgrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.vgrid{grid-template-columns:1fr}}
.vt{overflow-x:auto}
.vt table{min-width:520px}
.vt td,.vt th{padding:6px 8px;font-size:12.5px}
.vd{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;white-space:nowrap}
.vd.ok{background:var(--accent-soft);color:var(--accent)}
.vd.bad{background:var(--warn-soft);color:var(--warn)}
.vd.na{background:var(--soft);color:var(--muted)}
.vnote{color:var(--muted);font-size:12px}
.spark{display:flex;align-items:flex-end;gap:3px;height:38px;border-bottom:1px solid var(--line)}
.spark i{display:block;width:10px;background:var(--accent);border-radius:2px 2px 0 0;min-height:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>액티브 ETF 겹침 추적</h1>
    <div class="stamp" id="stamp"></div>
  </header>
  <div class="notice" id="notice" hidden></div>
  <section class="summary" id="summary" aria-label="요약"></section>
  <div class="controls">
    <div><span class="ctl-l">정렬</span><span class="seg" id="sortSeg">
      <button id="s-score" data-v="score" aria-pressed="true">겹침 점수</button>
      <button id="s-new" data-v="new" aria-pressed="false">신규 겹침</button>
      <button id="s-ret" data-v="ret" aria-pressed="false">수익률</button></span></div>
    <div><span class="ctl-l">필터</span><span class="seg" id="filtSeg">
      <button id="f-all" data-v="all" aria-pressed="true">전체</button>
      <button id="f-new" data-v="new" aria-pressed="false">신규 겹침만</button>
      <button id="f-sell" data-v="sell" aria-pressed="false">매도 경고</button></span></div>
  </div>
  <div class="tablebox">
    <table>
      <thead><tr>
        <th class="n">순위</th><th>종목</th><th class="n">보유 ETF</th><th class="n">2주 신규</th>
        <th class="n">공시 당시 가격</th><th class="n">현재가</th><th class="n">공시 이후</th><th>핵심 테마</th><th>사업 설명</th>
      </tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
  <section class="vbox" id="vbox" aria-label="교차 검증">
    <div class="vhead">
      <h2>GitHub 자동 수집 vs Claude 조사</h2>
      <span class="stamp" id="vstamp"></span>
    </div>
    <div id="vbody"></div>
  </section>
  <details class="method" id="method">
    <summary>판정 기준과 추적 ETF</summary>
    <ul id="rules"></ul>
    <div class="etfs" id="etfList"></div>
  </details>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
  const D = JSON.parse(document.getElementById('data').textContent);
  const S = D.summary, rows = D.rows || [];
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const pct = (v, d=1) => v == null ? '–' : (v > 0 ? '▲ ' : v < 0 ? '▼ ' : '') + Math.abs(v*100).toFixed(d) + '%';
  const cls = v => v == null ? '' : v > 0 ? 'up' : v < 0 ? 'down' : '';
  const px = v => v == null ? '–' : (v >= 1000 ? v.toLocaleString('en-US',{maximumFractionDigits:0}) : v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}));
  const md = d => d ? d.slice(5).replace('-', '/') : '';

  $('stamp').textContent = '기준 ' + S.generated + ' · 스냅샷 ' + S.snapshots + '일 (' + S.first_snapshot + '부터)';
  const notes = [];
  if (S.snapshots < 11) notes.push('<b>누적 ' + S.snapshots + '일차</b> — 최근 2주 신규 편입은 스냅샷이 11일 쌓이면 완전한 값이 됩니다. 그 전까지 신규 겹침 수는 실제보다 적게 나옵니다.');
  if (S.pending_etfs && S.pending_etfs.length) notes.push('수집 경로 준비 중인 ETF ' + S.pending_etfs.length + '개(50위 안): ' + S.pending_etfs.map(esc).join(', '));
  if (S.missing_etfs && S.missing_etfs.length) notes.push('오늘 보유종목을 받지 못한 ETF ' + S.missing_etfs.length + '개: ' + S.missing_etfs.map(esc).join(', '));
  if (S.stale_etfs && S.stale_etfs.length) notes.push('공시가 4일 넘게 갱신되지 않은 ETF: ' + S.stale_etfs.map(esc).join(', '));
  if (notes.length){ $('notice').innerHTML = notes.join('<br>'); $('notice').hidden = false; }

  const kpis = [
    ['추적 ETF', S.tracked_etfs, '대상 ' + S.universe_etfs + '개 중'],
    ['겹침 종목', S.overlap_count, '2개 이상 ETF 초과보유'],
    ['신규 겹침', S.new_overlap_count, '2주 내 2개+ ETF 매수'],
    ['평균 수익률', pct(S.avg_return), '공시 이후', cls(S.avg_return)],
    ['동시 매도 경고', S.sell_warn_count, '2주 내 2개+ ETF 감소'],
    ['최대 테마 비중', S.top_theme_share ? Math.round(S.top_theme_share*100) + '%' : '–', S.top_theme || '상위 30종목 기준']
  ];
  $('summary').innerHTML = kpis.map(k => '<div class="kpi"><div class="l">' + k[0] + '</div><div class="v ' + (k[3]||'') + '">' + esc(k[1]) + '</div><div class="s">' + esc(k[2]) + '</div></div>').join('');

  $('rules').innerHTML = [
    '신규 편입 = 새로 등장한 종목(비중 ' + D.params.min_new_weight + '% 이상) 또는 주식 수가 자금 유입 비율보다 ' + Math.round(D.params.add_excess*100) + '% 넘게 늘어난 종목',
    '자금 유입 비율 = ETF 좌수 변화율, 없으면 보유종목 대다수의 공통 주식 수 변화율',
    '보유 ETF 수 = 벤치마크보다 비중을 더 실은 ETF만 집계(벤치마크 자료가 없는 ETF는 보유 자체로 집계)',
    '겹침 점수 = 보유 ETF 수 + 2 × 최근 ' + D.params.window + '거래일 신규 편입 ETF 수 · 같은 기간에 샀다가 줄인 ETF는 신규에서 제외',
    '공시 당시 가격 = 처음 편입이 확인된 보유 기준일의 종가 · 현재가 = 최근 거래일 종가',
    '대상: 전세계 액티브 주식형 ETF 중 운용규모 상위 50개(체계적 팩터·인핸스드 인덱스·옵션인컴·반투명 제외)'
  ].map(t => '<li>' + esc(t) + '</li>').join('');
  $('etfList').innerHTML = Object.entries(D.etfs).sort((a,b) => (b[1].aum||0) - (a[1].aum||0))
    .map(([t,e]) => '<span class="' + (e.asof ? '' : 'miss') + '" title="' + esc(e.name) + ' · $' + (e.aum ?? '?') + 'B · 기준 ' + esc(e.asof || '없음') + '">' + esc(t) + '</span>').join('');

  let sort = 'score', filt = 'all', open = null;
  try { sort = localStorage.getItem('etf_sort') || sort; filt = localStorage.getItem('etf_filt') || filt; } catch(e){}

  function render(){
    let list = rows.slice();
    if (filt === 'new') list = list.filter(r => r.new2w >= 2);
    if (filt === 'sell') list = list.filter(r => r.sell_warn);
    if (sort === 'new') list.sort((a,b) => b.new2w - a.new2w || b.score - a.score);
    else if (sort === 'ret') list.sort((a,b) => (b.ret ?? -9) - (a.ret ?? -9));
    else list.sort((a,b) => b.score - a.score || b.new2w - a.new2w);
    if (!list.length){ $('tb').innerHTML = '<tr><td colspan="9" class="empty">조건에 맞는 종목이 없습니다.</td></tr>'; return; }
    $('tb').innerHTML = list.map(r => {
      const badge = (r.new2w >= 2 ? ' <span class="pill new">신규 ' + r.new2w + '</span>' : '') + (r.sell_warn ? ' <span class="pill sell">매도 ' + r.sells.length + '</span>' : '');
      let h = '<tr class="row" tabindex="0" data-s="' + esc(r.sym) + '" aria-expanded="' + (open === r.sym) + '">' +
        '<td class="n">' + r.rank + '</td>' +
        '<td><span class="sym">' + esc(r.sym) + '</span>' + badge + '<span class="cname">' + esc(r.name) + '</span></td>' +
        '<td class="n">' + r.holders + '</td><td class="n">' + r.new2w + '</td>' +
        '<td class="n d">' + px(r.p0) + '<small>' + md(r.d0) + '</small></td>' +
        '<td class="n d">' + px(r.p1) + '<small>' + md(r.d1) + '</small></td>' +
        '<td class="n ' + cls(r.ret) + '">' + pct(r.ret) + '</td>' +
        '<td class="theme">' + esc(r.theme || '–') + '</td><td class="desc">' + esc(r.desc || '') + '</td></tr>';
      if (open === r.sym){
        const hl = r.holder_list.map(x => '<span class="t">' + esc(x.etf) + '</span><span class="x">' + esc((D.etfs[x.etf]||{}).name || '') + '</span><span class="w">' + x.weight.toFixed(2) + '%</span><span class="w">' + (x.active == null ? '·' : '+' + x.active.toFixed(2)) + '</span>').join('');
        const nl = r.new_list.map(x => '<span class="t">' + esc(x.etf) + '</span><span class="x">' + (x.kind === 'new' ? '신규 편입' : '주식 수 증가') + '</span><span class="w">' + esc(x.date) + '</span><span></span>').join('');
        const sl = r.sells.length ? '<h3 style="margin-top:12px">최근 2주 감소·제외</h3><div class="etfs">' + r.sells.map(s => '<span>' + esc(s) + '</span>').join('') + '</div>' : '';
        h += '<tr class="detail"><td colspan="9"><div class="dgrid">' +
          '<div><h3>보유 ETF ' + r.holder_list.length + '개 · 비중 · 벤치마크 초과분</h3><div class="dl">' + (hl || '<span class="x">없음</span>') + '</div></div>' +
          '<div><h3>최근 2주 신규 편입 ETF</h3><div class="dl">' + (nl || '<span class="x">없음</span>') + '</div>' + sl + '</div>' +
          '</div></td></tr>';
      }
      return h;
    }).join('');
  }
  function setSeg(id, v){ document.querySelectorAll('#' + id + ' button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v)); }
  $('sortSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; sort = b.dataset.v; setSeg('sortSeg', sort); try{localStorage.setItem('etf_sort', sort)}catch(_){} render(); });
  $('filtSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; filt = b.dataset.v; setSeg('filtSeg', filt); try{localStorage.setItem('etf_filt', filt)}catch(_){} render(); });
  const toggle = tr => { const s = tr.dataset.s; open = open === s ? null : s; render(); };
  $('tb').addEventListener('click', e => { const tr = e.target.closest('tr.row'); if (tr) toggle(tr); });
  $('tb').addEventListener('keydown', e => { const tr = e.target.closest('tr.row'); if (tr && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); toggle(tr); } });
  setSeg('sortSeg', sort); setSeg('filtSeg', filt); render();

  // ---- 교차 검증 (한 달 비교 기간)
  const V = D.validation, VH = D.validation_history || [];
  if (!V){
    $('vbody').innerHTML = '<p class="vnote">첫 비교 결과는 다음 아침 갱신 뒤 표시됩니다. 매일 Claude가 GitHub 결과 상위 종목의 보유·신규 편입을 운용사 자료로 다시 확인하고, 별도로 조사한 신규 매수 종목과 맞춰 봅니다.</p>';
  } else {
    $('vstamp').textContent = '확인 ' + V.date + ' · GitHub 기준 ' + (V.github_generated || '');
    const vd = v => '<span class="vd ' + (v === '일치' ? 'ok' : v === '불일치' ? 'bad' : 'na') + '">' + esc(v) + '</span>';
    const mr = V.match_rate == null ? '–' : Math.round(V.match_rate * 100) + '%';
    const spark = VH.length ? '<div><h3>일치율 추이 (' + VH.length + '일)</h3><div class="spark">' +
      VH.map(h => '<i title="' + esc(h.date) + ' ' + Math.round((h.match_rate||0)*100) + '%" style="height:' + Math.max(4, Math.round((h.match_rate||0)*100)) + '%"></i>').join('') + '</div></div>' : '';
    const checks = (V.checks || []).map(c => '<tr><td class="sym">' + esc(c.sym) + '</td><td>' + esc(c.claim) + '</td><td>' + vd(c.verdict) + '</td><td class="vnote">' + esc(c.note || '') + '</td></tr>').join('');
    const lst = (arr, empty) => arr && arr.length ? arr.map(x => '<div><span class="sym">' + esc(x.sym) + '</span> <span class="vnote">' + esc(x.name || '') + ' — ' + esc(x.reason || '') + '</span></div>').join('') : '<div class="vnote">' + empty + '</div>';
    $('vbody').innerHTML =
      '<div class="vsum"><span>일치율 <b>' + mr + '</b></span><span>확인 <b>' + (V.checked ?? 0) + '</b></span><span>일치 <b>' + (V.matched ?? 0) + '</b></span><span>불일치 <b>' + (V.mismatched ?? 0) + '</b></span><span>확인불가 <b>' + (V.unverifiable ?? 0) + '</b></span></div>' +
      (V.summary ? '<p class="vnote" style="margin:0;max-width:90ch">' + esc(V.summary) + '</p>' : '') + spark +
      '<div class="vgrid"><div class="vt"><h3>GitHub 결과 확인</h3><table><thead><tr><th>종목</th><th>GitHub 판정</th><th>결과</th><th>근거</th></tr></thead><tbody>' + (checks || '<tr><td colspan="4" class="vnote">없음</td></tr>') + '</tbody></table></div>' +
      '<div style="display:grid;gap:12px;align-content:start"><div><h3>양쪽 모두 신규 매수로 본 종목</h3>' + lst(V.both, '없음') + '</div>' +
      '<div><h3>Claude 조사에서만 나온 종목</h3>' + lst(V.claude_only, '없음') + '</div>' +
      '<div><h3>GitHub에서만 나온 종목</h3>' + lst(V.github_only, '없음') + '</div></div></div>';
  }
})();
</script>
