name: Active ETF overlap

on:
  schedule:
    - cron: "5 22 * * 1-5"   # 평일 22:05 UTC = 한국 화~토 07:05 (미국 운용사 보유 공시 후)
    - cron: "5 9 * * 1-5"    # 18:05 KST — 한국·대만 장 마감 후 보유 반영
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "etf-overlap/**.py"
      - "etf-overlap/config/universe.json"
      - "etf-overlap/template.html"
      - ".github/workflows/etf-overlap.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: etf-overlap
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
    defaults:
      run:
        working-directory: etf-overlap
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet requests openpyxl yfinance lxml pandas pdfplumber

      - name: Collect holdings
        run: python collect.py

      - name: SEC N-PORT refresh (morning run)
        if: github.event.schedule == '5 22 * * 1-5' || github.event_name == 'workflow_dispatch'
        run: python backfill.py nport
        continue-on-error: true

      - name: Prices
        run: python prices.py 6mo

      - name: Analyze
        run: python analyze.py

      - name: Themes
        run: python themes.py && python analyze.py
        continue-on-error: true

      - name: Render dashboard
        run: python render.py

      - name: Commit data
        run: |
          git config user.name "etf-overlap-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data out config/themes.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "ETF overlap data $(TZ=Asia/Seoul date +%F_%H%M)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done

      - name: Prepare Pages
        run: mkdir -p ../_site && cp out/index.html ../_site/index.html && cp out/dashboard.json ../_site/
      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        continue-on-error: true
