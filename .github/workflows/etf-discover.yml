name: ETF holdings discovery
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["etf-overlap/config/discover_targets.json", "etf-overlap/discover.py"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: etf-overlap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --quiet requests openpyxl pandas lxml html5lib beautifulsoup4
      - run: python discover.py
      - name: Commit
        run: |
          git config user.name "etf-overlap-bot"; git config user.email "actions@users.noreply.github.com"
          git add out/discover.json
          git diff --cached --quiet || git commit -m "discover output"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
